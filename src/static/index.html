<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Estate Indexer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .hidden { display: none !important; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen text-gray-900 font-sans">

    <!-- Navbar -->
    <nav class="bg-white shadow-sm sticky top-0 z-10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="text-xl font-bold text-indigo-600">🏠 RE Indexer</div>
                <button id="btn-load-demo" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-4 rounded-md shadow flex items-center transition-colors">
            <span>⚡ Run Live Scrapers (Mumbai)</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex flex-col lg:flex-row gap-8">

        <!-- Sidebar Filters -->
        <aside class="w-full lg:w-1/4 bg-white p-6 rounded-lg shadow-sm border border-gray-100 self-start sticky top-24">
            <h2 class="text-lg font-semibold mb-6 border-b pb-2">Filter Properties</h2>

            <form id="search-form" class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Locality</label>
                    <input type="text" id="filter-locality" placeholder="e.g. Shahapur" class="w-full p-2 border border-gray-300 rounded-md focus:ring-indigo-500 focus:border-indigo-500">
                </div>

                <div class="space-y-2">
                    <label class="block text-sm font-medium text-gray-700">Budget (₹)</label>
                    <div class="flex gap-2">
                        <input type="number" id="filter-min-price" placeholder="Min" class="w-full p-2 border border-gray-300 rounded-md text-sm">
                        <input type="number" id="filter-max-price" placeholder="Max" class="w-full p-2 border border-gray-300 rounded-md text-sm">
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="block text-sm font-medium text-gray-700">Area (Sq.Ft)</label>
                    <div class="flex gap-2">
                        <input type="number" id="filter-min-area" placeholder="Min" class="w-full p-2 border border-gray-300 rounded-md text-sm">
                        <input type="number" id="filter-max-area" placeholder="Max" class="w-full p-2 border border-gray-300 rounded-md text-sm">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Sort By</label>
                    <select id="filter-sort" class="w-full p-2 border border-gray-300 rounded-md focus:ring-indigo-500 focus:border-indigo-500">
                        <option value="">Default</option>
                        <option value="price_asc">Lowest Price First</option>
                        <option value="price_desc">Highest Price First</option>
                        <option value="area_desc">Largest Area First</option>
                    </select>
                </div>

                <button type="submit" class="w-full bg-gray-900 hover:bg-gray-800 text-white font-medium py-2 px-4 rounded-md transition-colors mt-4">
                    Search
                </button>
            </form>
        </aside>

        <!-- Results Section -->
        <section class="w-full lg:w-3/4">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold">Search Results</h2>
                <span id="results-count" class="text-gray-500 text-sm">0 properties found</span>
            </div>

            <div id="results-container" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Property Cards will be injected here -->
            </div>

            <div id="loading-spinner" class="hidden flex justify-center items-center py-12">
                <svg class="animate-spin h-8 w-8 text-indigo-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
            </div>
        </section>
    </main>

    <!-- Compare Modal -->
    <div id="compare-modal" class="hidden fixed inset-0 z-50 overflow-y-auto" aria-labelledby="modal-title" role="dialog" aria-modal="true">
        <div class="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">

            <div class="fixed inset-0 bg-gray-500 bg-opacity-75 transition-opacity" aria-hidden="true" onclick="closeModal()"></div>
            <span class="hidden sm:inline-block sm:align-middle sm:h-screen" aria-hidden="true">&#8203;</span>

            <div class="inline-block align-bottom bg-white rounded-lg text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-4xl sm:w-full">
                <div class="bg-white px-4 pt-5 pb-4 sm:p-6 sm:pb-4">
                    <div class="sm:flex sm:items-start w-full">
                        <div class="mt-3 text-center sm:mt-0 sm:ml-4 sm:text-left w-full">
                            <div class="flex justify-between items-center mb-4">
                                <h3 class="text-xl leading-6 font-semibold text-gray-900" id="modal-title">
                                    Source Price Discrepancies
                                </h3>
                                <button onclick="closeModal()" class="text-gray-400 hover:text-gray-500 focus:outline-none">
                                    <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                                    </svg>
                                </button>
                            </div>

                            <div id="modal-content" class="mt-4">
                                <!-- Modal Content Injected Here -->
                            </div>
                        </div>
                    </div>
                </div>
                <div class="bg-gray-50 px-4 py-3 sm:px-6 sm:flex sm:flex-row-reverse">
                    <button type="button" class="mt-3 w-full inline-flex justify-center rounded-md border border-gray-300 shadow-sm px-4 py-2 bg-white text-base font-medium text-gray-700 hover:bg-gray-50 focus:outline-none sm:mt-0 sm:ml-3 sm:w-auto sm:text-sm" onclick="closeModal()">
                        Close
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Utilities
        const formatMoney = (amount) => {
            if (amount >= 10000000) return `₹ ${(amount / 10000000).toFixed(2)} Cr`;
            if (amount >= 100000) return `₹ ${(amount / 100000).toFixed(2)} Lakh`;
            return `₹ ${amount.toLocaleString('en-IN')}`;
        };

        const formatArea = (sqft) => {
            const guntha = (sqft / 1089).toFixed(1);
            return `${sqft.toLocaleString('en-IN')} sq.ft (${guntha} Guntha)`;
        };

        // DOM Elements
        const resultsContainer = document.getElementById('results-container');
        const resultsCount = document.getElementById('results-count');
        const loadingSpinner = document.getElementById('loading-spinner');
        const searchForm = document.getElementById('search-form');
        const btnLoadDemo = document.getElementById('btn-load-demo');
        const modal = document.getElementById('compare-modal');
        const modalContent = document.getElementById('modal-content');

        // Fetch properties
        const fetchProperties = async () => {
            resultsContainer.innerHTML = '';
            loadingSpinner.classList.remove('hidden');

            const locality = document.getElementById('filter-locality')?.value || '';
            const minPrice = document.getElementById('filter-min-price')?.value || '';
            const maxPrice = document.getElementById('filter-max-price')?.value || '';
            let minArea = document.getElementById('filter-min-area')?.value || '';
            let maxArea = document.getElementById('filter-max-area')?.value || '';
            const areaUnit = document.getElementById('area-unit-toggle') ? document.getElementById('area-unit-toggle').value : 'sqft';
            const sort = document.getElementById('filter-sort')?.value || '';

            // Auto-convert area back to sqft for the API if Guntha is selected
            if (areaUnit === 'guntha') {
                if (minArea) minArea = parseFloat(minArea) * 1089;
                if (maxArea) maxArea = parseFloat(maxArea) * 1089;
            }

            const params = new URLSearchParams();
            if (locality) params.append('locality', locality);
            if (minPrice) params.append('min_price', minPrice);
            if (maxPrice) params.append('max_price', maxPrice);
            if (minArea) params.append('min_area_sqft', minArea);
            if (maxArea) params.append('max_area_sqft', maxArea);
            if (sort) params.append('sort_by', sort);

            try {
                const res = await fetch(`/api/properties?${params.toString()}`);
                const data = await res.json();
                renderCards(data.clusters || []);
            } catch (err) {
                console.error("Failed to fetch properties:", err);
                resultsContainer.innerHTML = `<p class="text-red-500 col-span-2">Failed to load properties.</p>`;
            } finally {
                loadingSpinner.classList.add('hidden');
            }
        };

        // Render Property Cards
        const renderCards = (clusters) => {
            resultsCount.textContent = `${clusters.length} properties found`;

            if (clusters.length === 0) {
                resultsContainer.innerHTML = `<p class="text-gray-500 col-span-2 text-center py-10">No properties matched your criteria.</p>`;
                return;
            }

            clusters.forEach(cluster => {
                const card = document.createElement('div');
                card.className = "bg-white border border-gray-200 rounded-xl overflow-hidden shadow-sm hover:shadow-md transition-shadow flex flex-col h-full";

                card.innerHTML = `
                    <div class="p-6 flex-grow">
                        <div class="flex justify-between items-start mb-4">
                            <span class="inline-block px-3 py-1 bg-indigo-100 text-indigo-800 text-xs font-semibold rounded-full uppercase tracking-wide">
                                ${cluster.locality}
                            </span>
                            <span class="inline-flex items-center gap-1 text-xs font-medium text-amber-600 bg-amber-50 px-2 py-1 rounded-md border border-amber-200">
                                ⚡ Found across ${cluster.sources_count} sources
                            </span>
                        </div>

                        <h3 class="text-xl font-bold mb-2 text-gray-800 line-clamp-2" title="${cluster.listings && cluster.listings.length > 0 ? cluster.listings[0].title : 'Property Match'}">
                            ${cluster.listings && cluster.listings.length > 0 ? cluster.listings[0].title : 'Canonical Property Match'}
                        </h3>

                        <div class="grid grid-cols-2 gap-4 mt-6">
                            <div>
                                <p class="text-xs text-gray-500 uppercase tracking-wider mb-1">Median Price</p>
                                <p class="text-lg font-bold text-gray-900">${formatMoney(cluster.median_price_inr)}</p>
                            </div>
                            <div>
                                <p class="text-xs text-gray-500 uppercase tracking-wider mb-1">Avg Area</p>
                                <p class="text-sm font-medium text-gray-900">${formatArea(cluster.average_area_sqft)}</p>
                            </div>
                        </div>
                    </div>
                    <div class="p-4 bg-gray-50 border-t border-gray-100">
                        <button onclick="openModal('${cluster.canonical_id}')" class="w-full text-center text-indigo-600 font-medium hover:text-indigo-800 transition-colors">
                            Compare Sources & Discrepancies &rarr;
                        </button>
                    </div>
                `;
                resultsContainer.appendChild(card);
            });
        };

        // Modal Logic
        const openModal = async (canonicalId) => {
            modalContent.innerHTML = `<div class="text-center py-8"><span class="animate-pulse font-medium text-gray-500">Loading details...</span></div>`;
            modal.classList.remove('hidden');

            try {
                const res = await fetch(`/api/properties/${canonicalId}`);
                const data = await res.json();
                renderModalContent(data);
            } catch (err) {
                modalContent.innerHTML = `<p class="text-red-500">Failed to load details.</p>`;
            }
        };

        const renderModalContent = (data) => {
            let html = `
                <div class="mb-6 bg-indigo-50 p-4 rounded-lg">
                    <p class="text-sm text-indigo-800 mb-1">Canonical Reference</p>
                    <p class="text-lg font-bold text-gray-900">${data.locality} Property</p>
                    <div class="flex gap-4 mt-2 text-sm">
                        <p><span class="font-semibold">Median:</span> ${formatMoney(data.median_price_inr)}</p>
                        <p><span class="font-semibold">Avg Area:</span> ${formatArea(data.average_area_sqft)}</p>
                    </div>
                </div>

                <div class="overflow-x-auto border rounded-lg">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Source</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Title</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Listed Price</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Price / Sq.Ft</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Discrepancy (vs Median)</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Link</th>
                            </tr>
                        </thead>
                        <tbody class="bg-white divide-y divide-gray-200">
            `;

            data.listings.forEach(listing => {
                const diff = listing.price_inr - data.median_price_inr;
                const pct = ((diff / data.median_price_inr) * 100).toFixed(1);

                let diffBadge = `<span class="text-gray-500">Exact Match</span>`;
                if (diff > 0) diffBadge = `<span class="text-red-600 font-medium">+${formatMoney(diff)} (+${pct}%)</span>`;
                else if (diff < 0) diffBadge = `<span class="text-green-600 font-medium">${formatMoney(diff)} (${pct}%)</span>`;

                html += `
                    <tr class="hover:bg-gray-50">
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900 capitalize">
                            ${listing.source.replace('_', ' ')}
                        </td>
                        <td class="px-6 py-4 text-sm text-gray-500">
                            ${listing.title}<br>
                            <span class="text-xs text-gray-400">${formatArea(listing.area_sqft)}</span>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-bold text-gray-900">
                            ${formatMoney(listing.price_inr)}
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                            ₹${Math.round(listing.price_per_sqft).toLocaleString('en-IN')}/sqft
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm">
                            ${diffBadge}
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                            <a href="${listing.source_url}" target="_blank" class="text-indigo-600 hover:text-indigo-900 border border-indigo-200 hover:bg-indigo-50 px-3 py-1 rounded-md transition-colors">
                                View ↗
                            </a>
                        </td>
                    </tr>
                `;
            });

            html += `</tbody></table></div>`;
            modalContent.innerHTML = html;
        };

        const closeModal = () => {
            modal.classList.add('hidden');
        };

        // Event Listeners
        searchForm.addEventListener('submit', (e) => {
            e.preventDefault();
            fetchProperties();
        });

        btnLoadDemo.addEventListener('click', async () => {
            btnLoadDemo.disabled = true;
            btnLoadDemo.innerHTML = `<span class="animate-pulse">Scraping Live Data...</span>`;
            try {
                await fetch('/api/ingest/live', { method: 'POST' });
                await fetchProperties();
            } catch (err) {
                alert('Failed to scrape live data.');
            } finally {
                btnLoadDemo.disabled = false;
                btnLoadDemo.innerHTML = `⚡ Run Live Scrapers (Mumbai)`;
            }
        });

        // Init
        fetchProperties();
    </script>
</body>
</html>
