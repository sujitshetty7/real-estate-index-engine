<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THIKANA - Har Property. Ek Jagah.</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        .hidden { display: none !important; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .custom-map-marker { background: transparent; border: none; }
    </style>
</head>
<body class="bg-gray-50 h-screen overflow-hidden text-gray-900 font-sans flex flex-col">

    <!-- Navbar -->
    <header class="bg-white shadow-sm border-b border-gray-200 shrink-0 z-20">
        <div class="px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center gap-4">
                    <div class="text-2xl font-black text-indigo-600 tracking-tight">THIKANA</div>
                    <div class="hidden lg:block text-sm text-gray-500 font-medium tracking-wide border-l border-gray-300 pl-4 ml-1">Har Property. Ek Jagah.</div>
                </div>

                <!-- Navigation Links -->
                <nav class="hidden md:flex items-center gap-6 text-sm font-medium text-gray-700">
                    <a href="#" class="hover:text-indigo-600 transition-colors">Buy</a>
                    <a href="#" class="hover:text-indigo-600 transition-colors">Rent</a>
                    <a href="#" class="hover:text-indigo-600 transition-colors">Projects</a>
                    <a href="#" class="hover:text-indigo-600 transition-colors">Plot & Land</a>
                    <a href="#" class="hover:text-indigo-600 transition-colors">Commercial</a>
                </nav>

                <div class="flex items-center gap-4">
                    <a href="#" class="hidden sm:flex items-center gap-1 text-sm font-medium text-gray-700 hover:text-indigo-600 transition-colors">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
                        Saved
                    </a>
                    <a href="#" class="text-sm font-bold text-indigo-600 bg-indigo-50 px-4 py-2 rounded-lg hover:bg-indigo-100 transition-colors border border-indigo-200">Login</a>
                </div>
            </div>

            <!-- Category Tabs -->
            <div class="flex gap-6 overflow-x-auto custom-scrollbar border-t border-gray-100 py-3 text-sm font-medium text-gray-600">
                <a href="#" class="text-indigo-600 border-b-2 border-indigo-600 pb-1 whitespace-nowrap">All Properties</a>
                <a href="#" class="hover:text-indigo-600 whitespace-nowrap">Flats</a>
                <a href="#" class="hover:text-indigo-600 whitespace-nowrap">Plots</a>
                <a href="#" class="hover:text-indigo-600 whitespace-nowrap">Farm Land</a>
                <a href="#" class="hover:text-indigo-600 whitespace-nowrap">Villas</a>
                <a href="#" class="hover:text-indigo-600 whitespace-nowrap">Independent Houses</a>
            </div>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="flex-grow flex overflow-hidden relative">

        <!-- Left Filter Sidebar -->
        <aside class="w-64 bg-white border-r border-gray-200 shadow-sm flex flex-col shrink-0 overflow-y-auto hidden md:block z-10 custom-scrollbar">
            <div class="p-4">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-lg font-bold text-gray-900">Filters</h3>
                    <button type="button" class="text-xs text-indigo-600 font-medium hover:underline">Clear all</button>
                </div>
                <form id="filter-sidebar" class="space-y-6">
                    <!-- Location -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Location</label>
                        <input type="text" id="filter-locality" value="Shahapur" class="w-full text-sm border border-gray-300 rounded-lg px-3 py-2 focus:ring-indigo-500 focus:border-indigo-500" placeholder="e.g. Shahapur">
                    </div>

                    <!-- Property Type -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Property Type</label>
                        <select class="w-full text-sm border border-gray-300 rounded-lg px-3 py-2 focus:ring-indigo-500 focus:border-indigo-500 bg-white">
                            <option value="">Any</option>
                            <option value="plot">Plot / Land</option>
                            <option value="flat">Flat / Apartment</option>
                            <option value="house">House / Villa</option>
                        </select>
                    </div>

                    <!-- Budget -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Budget</label>
                        <div class="flex gap-2">
                            <input type="number" id="filter-min-price" placeholder="Min" class="w-1/2 text-sm border border-gray-300 rounded-lg px-3 py-2 focus:ring-indigo-500 focus:border-indigo-500">
                            <input type="number" id="filter-max-price" placeholder="Max" class="w-1/2 text-sm border border-gray-300 rounded-lg px-3 py-2 focus:ring-indigo-500 focus:border-indigo-500">
                        </div>
                    </div>

                    <!-- Area -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Area (sq.ft)</label>
                        <div class="flex gap-2">
                            <input type="number" id="filter-min-area" placeholder="Min" class="w-1/2 text-sm border border-gray-300 rounded-lg px-3 py-2 focus:ring-indigo-500 focus:border-indigo-500">
                            <input type="number" id="filter-max-area" placeholder="Max" class="w-1/2 text-sm border border-gray-300 rounded-lg px-3 py-2 focus:ring-indigo-500 focus:border-indigo-500">
                        </div>
                    </div>

                    <!-- BHK -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">BHK</label>
                        <div class="flex gap-2 flex-wrap">
                            <button type="button" class="px-3 py-1 text-sm border border-gray-300 rounded-full hover:border-indigo-500 hover:text-indigo-600 bg-white">1</button>
                            <button type="button" class="px-3 py-1 text-sm border border-gray-300 rounded-full hover:border-indigo-500 hover:text-indigo-600 bg-white">2</button>
                            <button type="button" class="px-3 py-1 text-sm border border-gray-300 rounded-full hover:border-indigo-500 hover:text-indigo-600 bg-white">3</button>
                            <button type="button" class="px-3 py-1 text-sm border border-gray-300 rounded-full hover:border-indigo-500 hover:text-indigo-600 bg-white">4+</button>
                        </div>
                    </div>

                    <!-- Transaction Type -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Transaction Type</label>
                        <div class="space-y-2">
                            <label class="flex items-center gap-2 text-sm"><input type="checkbox" class="rounded text-indigo-600 focus:ring-indigo-500"> Resale</label>
                            <label class="flex items-center gap-2 text-sm"><input type="checkbox" class="rounded text-indigo-600 focus:ring-indigo-500"> New Booking</label>
                        </div>
                    </div>

                    <!-- Status -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Status</label>
                        <div class="space-y-2">
                            <label class="flex items-center gap-2 text-sm"><input type="checkbox" class="rounded text-indigo-600 focus:ring-indigo-500"> Ready to Move</label>
                            <label class="flex items-center gap-2 text-sm"><input type="checkbox" class="rounded text-indigo-600 focus:ring-indigo-500"> Under Construction</label>
                        </div>
                    </div>

                    <!-- Builder -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Builder</label>
                        <input type="text" class="w-full text-sm border border-gray-300 rounded-lg px-3 py-2 focus:ring-indigo-500 focus:border-indigo-500" placeholder="Search builder">
                    </div>

                    <!-- Source -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Source</label>
                        <div class="space-y-2">
                            <label class="flex items-center gap-2 text-sm"><input type="checkbox" class="rounded text-indigo-600 focus:ring-indigo-500" checked> SquareYards</label>
                            <label class="flex items-center gap-2 text-sm"><input type="checkbox" class="rounded text-indigo-600 focus:ring-indigo-500" checked> NoBroker</label>
                            <label class="flex items-center gap-2 text-sm"><input type="checkbox" class="rounded text-indigo-600 focus:ring-indigo-500" checked> Other</label>
                        </div>
                    </div>

                    <div class="pt-4 border-t border-gray-200 sticky bottom-0 bg-white pb-2">
                        <button type="submit" id="apply-filters-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-4 rounded-lg shadow-sm transition-colors">
                            Apply Filters
                        </button>
                    </div>
                </form>
            </div>
        </aside>

        <!-- Right Side: Results + Map Split -->
        <section class="flex-grow flex flex-col lg:flex-row bg-white relative">

            <!-- Results List -->
            <div class="w-full lg:w-1/2 xl:w-[55%] flex flex-col shadow-[4px_0_10px_rgba(0,0,0,0.05)] z-10 bg-white border-r border-gray-200">
                <!-- Header/Sort -->
                <div class="p-4 border-b border-gray-200 flex justify-between items-center bg-white z-20 shrink-0">
                    <span id="results-count" class="text-sm font-bold text-gray-700">0 properties found</span>
                    <select id="filter-sort" class="text-sm border border-gray-300 rounded-lg py-1.5 pl-3 pr-8 focus:ring-indigo-500 focus:border-indigo-500 bg-white">
                        <option value="">Sort by: Relevance</option>
                        <option value="price_asc">Price: Low to High</option>
                        <option value="price_desc">Price: High to Low</option>
                    </select>
                </div>

                <!-- Scrollable Cards -->
                <div class="flex-grow overflow-y-auto custom-scrollbar bg-gray-50/50 p-4">
                    <div id="results-container" class="space-y-4 pb-12">
                        <!-- Cards injected here -->
                    </div>

                    <div id="loading-spinner" class="hidden flex flex-col justify-center items-center py-20 text-gray-400">
                        <svg class="animate-spin h-10 w-10 text-indigo-500 mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                        <p class="font-medium">Finding the best properties...</p>
                    </div>
                </div>
            </div>

            <!-- Leaflet Map Area -->
            <div class="lg:w-1/2 xl:w-[45%] bg-gray-200 relative z-0 h-full w-full" id="map" style="min-height: 500px;">
                <!-- Map Container -->
            </div>
        </section>
    </main>

    <!-- Compare Modal (Amazon Style) -->
    <div id="compare-modal" class="hidden fixed inset-0 z-50 overflow-y-auto" aria-labelledby="modal-title" role="dialog" aria-modal="true">
        <div class="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
            <div class="fixed inset-0 bg-gray-900 bg-opacity-60 transition-opacity backdrop-blur-sm" aria-hidden="true" onclick="closeModal()"></div>
            <span class="hidden sm:inline-block sm:align-middle sm:h-screen" aria-hidden="true">&#8203;</span>

            <div class="inline-block align-bottom bg-white rounded-2xl text-left overflow-hidden shadow-2xl transform transition-all sm:my-8 sm:align-middle sm:max-w-4xl sm:w-full border border-gray-100">
                <div class="bg-white px-4 pt-5 pb-4 sm:p-6 sm:pb-4">
                    <div class="flex justify-between items-center mb-6 border-b border-gray-100 pb-4">
                        <div>
                            <h3 class="text-2xl font-bold text-gray-900" id="modal-title">Compare Listings</h3>
                            <p class="text-sm text-gray-500 mt-1">Same property found on multiple sources</p>
                        </div>
                        <button onclick="closeModal()" class="text-gray-400 hover:text-gray-700 bg-gray-100 hover:bg-gray-200 p-2 rounded-full focus:outline-none transition-colors">
                            <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
                        </button>
                    </div>

                    <div id="modal-content" class="mt-2">
                        <!-- Modal Content -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Utilities
        const formatMoney = (amount) => {
            if (amount >= 10000000) return `₹ ${(amount / 10000000).toFixed(2)} Cr`;
            if (amount >= 100000) return `₹ ${(amount / 100000).toFixed(2)} Lakh`;
            return `₹ ${amount.toLocaleString('en-IN')}`;
        };

        const formatArea = (sqft) => {
            return `${sqft.toLocaleString('en-IN')} sq.ft`;
        };

        const getSourceLogo = (sourceName) => {
            const name = sourceName.toLowerCase();
            if (name.includes('nobroker')) return '<span class="bg-red-100 text-red-800 px-2 py-1 rounded text-xs font-bold border border-red-200">NoBroker</span>';
            if (name.includes('squareyards')) return '<span class="bg-yellow-100 text-yellow-800 px-2 py-1 rounded text-xs font-bold border border-yellow-200">SquareYards</span>';
            return `<span class="bg-gray-100 text-gray-800 px-2 py-1 rounded text-xs font-bold border border-gray-200 capitalize">${sourceName.replace('_', ' ')}</span>`;
        };

        // DOM Elements
        const resultsContainer = document.getElementById('results-container');
        const resultsCount = document.getElementById('results-count');
        const loadingSpinner = document.getElementById('loading-spinner');
        const filterForm = document.getElementById('filter-sidebar');
        const sortSelect = document.getElementById('filter-sort');
        const modal = document.getElementById('compare-modal');
        const modalContent = document.getElementById('modal-content');

        // Map Initialization
        let map = null;
        let markers = [];

        const initMap = () => {
            if (map !== null) return;
            const mapEl = document.getElementById('map');
            if (!mapEl || mapEl.offsetParent === null) return; // Don't init if hidden

            map = L.map('map').setView([19.444983, 73.250550], 12);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap contributors',
                maxZoom: 19
            }).addTo(map);
        };

        const updateMapMarkers = (clusters) => {
            if (!map) initMap();
            if (!map) return;

            // Clear existing markers
            markers.forEach(m => map.removeLayer(m));
            markers = [];

            // Group clusters by locality to avoid fabricating individual property locations
            const localityGroups = {};
            clusters.forEach(cluster => {
                const loc = cluster.locality || 'Unknown';
                if (!localityGroups[loc]) localityGroups[loc] = [];
                localityGroups[loc].push(cluster);
            });

            // Known locality base coordinates.
            const localityCoords = {
                'Shahapur': [19.444983, 73.250550],
                'Asangaon': [19.4398, 73.3000],
                'Khadavli': [19.3876, 73.2307],
                'Vasind': [19.4035, 73.2706],
                'default': [19.444983, 73.250550]
            };

            Object.entries(localityGroups).forEach(([loc, locClusters]) => {
                const coords = localityCoords[loc] || localityCoords['default'];

                const icon = L.divIcon({
                    className: 'custom-map-marker',
                    html: `<div class="bg-indigo-600 text-white font-bold text-xs px-2 py-1 rounded shadow-lg border border-white whitespace-nowrap relative">
                            ${locClusters.length} Props
                            <div class="absolute w-2 h-2 bg-indigo-600 rotate-45 -bottom-1 left-1/2 -translate-x-1/2 border-r border-b border-white"></div>
                           </div>`,
                    iconSize: [60, 24],
                    iconAnchor: [30, 24]
                });

                const marker = L.marker(coords, { icon }).addTo(map);

                let popupHtml = `<div class="p-2 min-w-[220px] max-h-[250px] overflow-y-auto">
                    <p class="font-bold text-sm mb-2 border-b pb-1 text-gray-800">${loc} Area (${locClusters.length} properties)</p>`;

                locClusters.forEach(c => {
                    const listings = c.listings || [];
                    if (listings.length === 0) return;
                    const minPrice = Math.min(...listings.map(l => l.price_inr));

                    popupHtml += `
                        <div class="mb-3 border-b pb-2 last:border-0 last:mb-0 last:pb-0">
                            <p class="text-xs font-bold text-gray-900 truncate" title="${listings[0].title}">${listings[0].title}</p>
                            <div class="flex justify-between items-center mt-1">
                                <span class="text-xs text-gray-600">${formatArea(c.average_area_sqft)}</span>
                                <span class="text-indigo-600 font-bold text-sm">${formatMoney(minPrice)}</span>
                            </div>
                            <button onclick="openModal('${c.canonical_id}')" class="mt-2 text-[10px] uppercase tracking-wider bg-indigo-50 hover:bg-indigo-100 text-indigo-700 px-2 py-1 rounded w-full border border-indigo-200 font-bold transition-colors">
                                Compare ${c.sources_count} sources
                            </button>
                        </div>
                    `;
                });
                popupHtml += `</div>`;

                marker.bindPopup(popupHtml);
                markers.push(marker);
            });

            if (markers.length > 0) {
                const group = new L.featureGroup(markers);
                map.fitBounds(group.getBounds().pad(0.1));
            }
        };

        // Fetch properties
        const fetchProperties = async () => {
            resultsContainer.innerHTML = '';
            loadingSpinner.classList.remove('hidden');
            resultsCount.textContent = 'Searching...';

            const locality = document.getElementById('filter-locality')?.value || '';
            const minPrice = document.getElementById('filter-min-price')?.value || '';
            const maxPrice = document.getElementById('filter-max-price')?.value || '';
            const minArea = document.getElementById('filter-min-area')?.value || '';
            const maxArea = document.getElementById('filter-max-area')?.value || '';
            const sort = sortSelect?.value || '';

            const params = new URLSearchParams();
            if (locality) params.append('locality', locality);
            if (minPrice) params.append('min_price', minPrice);
            if (maxPrice) params.append('max_price', maxPrice);
            if (minArea) params.append('min_area_sqft', minArea);
            if (maxArea) params.append('max_area_sqft', maxArea);
            if (sort) params.append('sort_by', sort);

            try {
                const res = await fetch(`/api/properties?${params.toString()}`);
                const data = await res.json();
                renderCards(data.clusters || []);

                // Update map
                setTimeout(() => {
                    updateMapMarkers(data.clusters || []);
                }, 100);

            } catch (err) {
                console.error("Failed to fetch properties:", err);
                resultsContainer.innerHTML = `<div class="bg-red-50 text-red-600 p-4 rounded-lg font-medium">Unable to load properties right now. Please try again later.</div>`;
                resultsCount.textContent = 'Error';
            } finally {
                loadingSpinner.classList.add('hidden');
            }
        };

        // Render Property Cards
        const renderCards = (clusters) => {
            resultsCount.textContent = `${clusters.length} properties found`;

            if (clusters.length === 0) {
                resultsContainer.innerHTML = `
                    <div class="text-center py-16 bg-white rounded-xl shadow-sm border border-gray-200">
                        <span class="text-4xl block mb-3">🔍</span>
                        <h3 class="text-lg font-medium text-gray-900">No properties found</h3>
                        <p class="text-gray-500 mt-1">Try adjusting your search terms.</p>
                    </div>`;
                return;
            }

            clusters.forEach(cluster => {
                const listings = cluster.listings || [];
                if (listings.length === 0) return;

                const minPrice = Math.min(...listings.map(l => l.price_inr));
                const sources = [...new Set(listings.map(l => l.source))];
                const sourceBadges = sources.map(s => getSourceLogo(s)).join(' ');

                const mainListing = listings[0];
                const title = mainListing.title;
                const pricePerSqft = Math.round(minPrice / cluster.average_area_sqft);
                const updatedDate = new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
                const verifiedBadge = `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded text-[10px] font-bold bg-blue-50 text-blue-700 border border-blue-200"><svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path></svg> Verified</span>`;

                const card = document.createElement('div');
                card.className = "bg-white border border-gray-200 rounded-xl overflow-hidden shadow-sm hover:shadow-md transition-all group";

                card.innerHTML = `
                    <div class="flex flex-col sm:flex-row h-full relative">
                        <!-- Save Button Overlay -->
                        <button class="absolute top-2 right-2 bg-white/90 backdrop-blur p-1.5 rounded-full text-gray-400 hover:text-red-500 shadow-sm z-10 transition-colors border border-gray-100" title="Save Property">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
                        </button>

                        <!-- Image placeholder -->
                        <div class="w-full sm:w-48 h-48 sm:h-auto bg-gray-100 shrink-0 relative border-r border-gray-100">
                            <div class="absolute inset-0 flex flex-col items-center justify-center text-gray-400">
                                <svg class="w-10 h-10 mb-2 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                                <span class="text-xs font-medium uppercase tracking-wider text-gray-500">No Image</span>
                            </div>
                            <div class="absolute top-2 left-2 bg-black/70 backdrop-blur-sm text-white text-[10px] font-bold px-2 py-1 rounded uppercase tracking-wide z-10">
                                ${cluster.locality}
                            </div>
                        </div>

                        <!-- Content -->
                        <div class="p-5 flex-grow flex flex-col justify-between">
                            <div>
                                <div class="flex justify-between items-start gap-2 mb-1 pr-8">
                                    <h3 class="text-lg font-bold text-gray-900 leading-tight group-hover:text-indigo-600 transition-colors line-clamp-2" title="${title}">
                                        ${title}
                                    </h3>
                                </div>
                                <div class="flex items-center gap-2 mb-2">
                                    ${verifiedBadge}
                                    <span class="text-xs text-gray-500 font-medium">Updated ${updatedDate}</span>
                                </div>
                                <p class="text-sm text-gray-600 mb-3 font-medium">${formatArea(cluster.average_area_sqft)} &bull; ₹${pricePerSqft.toLocaleString('en-IN')}/sq.ft</p>

                                <div class="mb-4">
                                    <div class="text-xs text-gray-500 font-bold uppercase tracking-wide mb-1">Lowest price found</div>
                                    <div class="flex items-end gap-2">
                                        <span class="text-2xl font-black text-gray-900 leading-none">${formatMoney(minPrice)}</span>
                                    </div>
                                </div>
                            </div>

                            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mt-2 pt-4 border-t border-gray-100">
                                <div class="flex items-center gap-2 flex-wrap">
                                    <span class="text-xs text-gray-500 font-bold">FOUND ON</span>
                                    ${sourceBadges}
                                </div>
                                <div class="flex gap-2 w-full sm:w-auto">
                                    <a href="${mainListing.source_url}" target="_blank" rel="noopener noreferrer" class="flex-1 sm:flex-none bg-white hover:bg-gray-50 text-gray-700 border border-gray-300 font-semibold py-2 px-4 rounded-lg text-sm transition-colors flex items-center justify-center gap-1 whitespace-nowrap shadow-sm">
                                        View Property
                                    </a>
                                    <button onclick="openModal('${cluster.canonical_id}')" class="flex-1 sm:flex-none bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200 font-bold py-2 px-4 rounded-lg text-sm transition-colors flex items-center justify-center gap-1.5 whitespace-nowrap shadow-sm">
                                        Compare
                                        <span class="bg-indigo-600 text-white text-[10px] px-1.5 py-0.5 rounded-full">${cluster.sources_count} sources</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                resultsContainer.appendChild(card);
            });
        };

        // Modal Logic
        const openModal = async (canonicalId) => {
            modalContent.innerHTML = `
                <div class="flex flex-col items-center justify-center py-12 text-gray-400">
                    <svg class="animate-spin h-8 w-8 text-indigo-500 mb-3" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                    <span class="font-medium">Loading comparison data...</span>
                </div>`;
            modal.classList.remove('hidden');

            try {
                const res = await fetch(`/api/properties/${canonicalId}`);
                const data = await res.json();
                renderModalContent(data);
            } catch (err) {
                modalContent.innerHTML = `<div class="bg-red-50 text-red-600 p-4 rounded-lg text-center font-medium">Failed to load comparison data.</div>`;
            }
        };

        const renderModalContent = (data) => {
            const listings = data.listings || [];
            if (listings.length === 0) return;

            listings.sort((a, b) => a.price_inr - b.price_inr);
            const minPrice = listings[0].price_inr;

            let html = `
                <div class="mb-6 bg-gray-50 border border-gray-200 rounded-xl p-5 flex flex-col md:flex-row gap-4 items-start md:items-center justify-between">
                    <div>
                        <h4 class="text-lg font-bold text-gray-900 mb-1 line-clamp-2">${listings[0].title}</h4>
                        <p class="text-sm text-gray-600 font-medium">${data.locality} &bull; ${formatArea(data.average_area_sqft)}</p>
                    </div>
                    <div class="text-left md:text-right shrink-0">
                        <p class="text-xs text-gray-500 uppercase font-bold tracking-wide mb-1">Median Market Value</p>
                        <p class="text-xl font-black text-gray-800">${formatMoney(data.median_price_inr)}</p>
                    </div>
                </div>

                <div class="border border-gray-200 rounded-xl overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="min-w-full divide-y divide-gray-200">
                            <thead class="bg-gray-50">
                                <tr>
                                    <th scope="col" class="px-6 py-4 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">Source</th>
                                    <th scope="col" class="px-6 py-4 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">Listed Price</th>
                                    <th scope="col" class="px-6 py-4 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">Price/Sq.Ft</th>
                                    <th scope="col" class="px-6 py-4 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">Verdict</th>
                                    <th scope="col" class="px-6 py-4 text-right text-xs font-bold text-gray-500 uppercase tracking-wider">Action</th>
                                </tr>
                            </thead>
                            <tbody class="bg-white divide-y divide-gray-200">
            `;

            listings.forEach((listing) => {
                const isLowest = listing.price_inr === minPrice;
                const diffFromMin = listing.price_inr - minPrice;

                let verdictBadge = '';
                if (isLowest) {
                    verdictBadge = `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-bold bg-green-100 text-green-800 border border-green-200">Best Price</span>`;
                } else {
                    verdictBadge = `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-bold bg-red-50 text-red-700 border border-red-100">+${formatMoney(diffFromMin)}</span>`;
                }

                html += `
                    <tr class="hover:bg-gray-50 transition-colors ${isLowest ? 'bg-green-50/30' : ''}">
                        <td class="px-6 py-5 whitespace-nowrap">
                            ${getSourceLogo(listing.source)}
                            <div class="text-xs text-gray-400 mt-1 max-w-[150px] truncate" title="${listing.title}">${listing.title}</div>
                        </td>
                        <td class="px-6 py-5 whitespace-nowrap">
                            <div class="text-lg font-black ${isLowest ? 'text-green-700' : 'text-gray-900'}">${formatMoney(listing.price_inr)}</div>
                        </td>
                        <td class="px-6 py-5 whitespace-nowrap text-sm text-gray-600 font-medium">
                            ₹${Math.round(listing.price_per_sqft).toLocaleString('en-IN')}
                        </td>
                        <td class="px-6 py-5 whitespace-nowrap">
                            ${verdictBadge}
                        </td>
                        <td class="px-6 py-5 whitespace-nowrap text-right">
                            <a href="${listing.source_url}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1.5 px-4 py-2 bg-gray-900 hover:bg-gray-800 text-white text-sm font-semibold rounded-lg shadow-sm transition-colors">
                                View Deal
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                            </a>
                        </td>
                    </tr>
                `;
            });

            html += `</tbody></table></div></div>
            <div class="mt-4 flex justify-between items-center text-sm text-gray-500 px-2">
                <p>Prices are grouped automatically based on property similarity.</p>
                <p>Data last updated today.</p>
            </div>
            `;

            modalContent.innerHTML = html;
        };

        const closeModal = () => {
            modal.classList.add('hidden');
        };

        // Event Listeners
        filterForm.addEventListener('submit', (e) => {
            e.preventDefault();
            fetchProperties();
        });

        sortSelect.addEventListener('change', () => {
            fetchProperties();
        });

        // Initialize Map and fetch data
        window.addEventListener('load', () => {
            initMap();
            // Handle window resize for map initialization (if switching from mobile to desktop view)
            window.addEventListener('resize', () => {
                if (window.innerWidth >= 1024 && !map) {
                    initMap();
                    fetchProperties(); // Re-fetch to update map markers
                }
            });
        });

        fetchProperties();
    </script>
</body>
</html>
